name: Release

on:
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  # Build CLI binaries
  cli:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            artifact_name: 'easykpf-macos-aarch64'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            artifact_name: 'easykpf-macos-x86_64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            artifact_name: 'easykpf-linux-x86_64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            artifact_name: 'easykpf-windows-x86_64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Update version if release starts with 'v'
        shell: bash
        run: ./etc/update-version.sh "${{ github.ref_name }}"

      - name: Build CLI
        shell: bash
        run: |
          cargo build --release --package easy-kpf-cli --target ${{ matrix.target }}
          if [ "${{ matrix.platform }}" != "windows-latest" ]; then
            cargo build --release --package easy-kpf-kpfctl --target ${{ matrix.target }}
          fi

      - name: Prepare artifact (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          mkdir -p dist/${{ matrix.artifact_name }}/completions
          cp target/${{ matrix.target }}/release/easykpf dist/${{ matrix.artifact_name }}/easykpf
          cp target/${{ matrix.target }}/release/ekpfctl dist/${{ matrix.artifact_name }}/ekpfctl
          chmod +x dist/${{ matrix.artifact_name }}/easykpf dist/${{ matrix.artifact_name }}/ekpfctl
          ./dist/${{ matrix.artifact_name }}/ekpfctl completions bash > dist/${{ matrix.artifact_name }}/completions/ekpfctl.bash
          ./dist/${{ matrix.artifact_name }}/ekpfctl completions zsh  > dist/${{ matrix.artifact_name }}/completions/_ekpfctl
          ./dist/${{ matrix.artifact_name }}/ekpfctl completions fish > dist/${{ matrix.artifact_name }}/completions/ekpfctl.fish
          cd dist && tar -czvf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Prepare artifact (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.artifact_name }}"
          Copy-Item "target/${{ matrix.target }}/release/easykpf.exe" "dist/${{ matrix.artifact_name }}/easykpf.exe"
          Compress-Archive -Path "dist/${{ matrix.artifact_name }}/*" -DestinationPath "dist/${{ matrix.artifact_name }}.zip"

      - name: Upload CLI artifact to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            gh release upload "${{ github.ref_name }}" "dist/${{ matrix.artifact_name }}.zip" --clobber --repo "${{ github.repository }}"
          else
            gh release upload "${{ github.ref_name }}" "dist/${{ matrix.artifact_name }}.tar.gz" --clobber --repo "${{ github.repository }}"
          fi
        shell: bash

  # Build GUI app with Tauri
  gui:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            arch: 'aarch64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            arch: 'x64'
          - platform: 'ubuntu-22.04'
            args: ''
            arch: ''
          - platform: 'windows-latest'
            args: ''
            arch: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Update version if release starts with 'v'
        shell: bash
        run: ./etc/update-version.sh "${{ github.ref_name }}"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Import Code-Signing Certificates (macOS)
        if: matrix.platform == 'macos-latest'
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build the app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EasyKpf v__VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Rename macOS DMG for Homebrew
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the DMG file in the artifacts
          DMG_PATH=$(find target -name "*.dmg" -type f 2>/dev/null | head -1)
          if [ -n "$DMG_PATH" ]; then
            NEW_NAME="EasyKpf_${{ matrix.arch }}.dmg"
            # Copy to new name and upload
            cp "$DMG_PATH" "$NEW_NAME"
            gh release upload "${{ github.ref_name }}" "$NEW_NAME" --clobber --repo "${{ github.repository }}"
          fi

  # Update Homebrew tap with new SHA256 checksums
  update-homebrew:
    needs: [cli, gui]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - name: Download exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-assets
          version="${RELEASE_TAG#v}"
          for name in EasyKpf_aarch64.dmg EasyKpf_x64.dmg easykpf-macos-aarch64.tar.gz easykpf-macos-x86_64.tar.gz easykpf-linux-x86_64.tar.gz; do
            gh release download "$RELEASE_TAG" --pattern "$name" --dir release-assets --repo "$GITHUB_REPOSITORY"
            test -s "release-assets/$name"
            case "$name" in
              *.dmg) hdiutil verify "release-assets/$name" ;;
              *.tar.gz) tar -tzf "release-assets/$name" >/dev/null ;;
            esac
          done

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: tonisives/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update tap from verified assets
        run: |
          python3 homebrew-tap/scripts/update_release.py \
            --product easy-kpf --tag "$RELEASE_TAG" \
            --assets release-assets --tap homebrew-tap

      - name: Verify Homebrew entries before publishing
        run: |
          set -euo pipefail
          brew tap tonisives/tap
          if brew help trust >/dev/null 2>&1; then brew trust --tap tonisives/tap; fi
          tap_dir="$(brew --repository tonisives/tap)"
          cp homebrew-tap/Casks/easy-kpf.rb "$tap_dir/Casks/easy-kpf.rb"
          cp homebrew-tap/Formula/easykpf.rb "$tap_dir/Formula/easykpf.rb"
          brew style homebrew-tap/Casks/easy-kpf.rb homebrew-tap/Formula/easykpf.rb
          brew audit --cask --strict tonisives/tap/easy-kpf
          brew fetch --cask tonisives/tap/easy-kpf
          brew audit --formula --strict tonisives/tap/easykpf
          brew fetch --formula tonisives/tap/easykpf

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/easy-kpf.rb Formula/easykpf.rb
          git diff --staged --quiet || git commit -m "Update easy-kpf to $RELEASE_TAG"
          git push
